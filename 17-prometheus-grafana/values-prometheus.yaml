# Helm values override for kube-prometheus-stack
grafana:
  enabled: true
  adminPassword: "changeme"
  service:
    type: ClusterIP
  persistence:
    enabled: true
    size: 5Gi
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - grafana.example.com

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

alertmanager:
  enabled: true
