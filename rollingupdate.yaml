apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-deployment
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: rolling-nginx

  template:
    metadata:
      labels:
        app: rolling-nginx
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.26
          ports:
            - containerPort: 80