# hostPath: mounts a file/directory from the host node's filesystem (use with caution)
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: dev
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: host-volume
          mountPath: /host-data
  volumes:
    - name: host-volume
      hostPath:
        path: /var/log/myapp
        type: DirectoryOrCreate
