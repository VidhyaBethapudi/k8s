# emptyDir: temporary storage, lives as long as the Pod, deleted on Pod removal
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-pod
  namespace: dev
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo hello > /data/msg.txt && sleep 3600"]
      volumeMounts:
        - name: cache-volume
          mountPath: /data
  volumes:
    - name: cache-volume
      emptyDir:
        sizeLimit: 500Mi
