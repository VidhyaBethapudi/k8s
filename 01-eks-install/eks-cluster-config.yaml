# eksctl declarative cluster config (best practice over ad-hoc CLI flags)
# Usage: eksctl create cluster -f eks-cluster-config.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: my-eks-cluster
  region: ap-south-1
  version: "1.30"

vpc:
  cidr: "10.0.0.0/16"
  nat:
    gateway: Single   # Single NAT to save cost; use HighlyAvailable for prod

iam:
  withOIDC: true      # Required for IRSA (IAM Roles for Service Accounts)

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 4
    volumeSize: 20
    ssh:
      allow: false
    labels:
      role: worker
    tags:
      Environment: dev

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
