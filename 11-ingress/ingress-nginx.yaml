# Ingress using the community ingress-nginx controller (alternative to ALB controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress-nginxclass
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: app-tls-secret
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-clusterip
                port:
                  number: 80
