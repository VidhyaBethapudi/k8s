# Multi-container Pod with a sidecar (shares network namespace + volumes)
apiVersion: v1
kind: Pod
metadata:
  name: app-with-sidecar
  namespace: dev
spec:
  containers:
    - name: main-app
      image: myapp:1.0
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
    - name: log-shipper
      image: busybox:1.36
      command: ["sh", "-c", "tail -f /var/log/app/*.log"]
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
  volumes:
    - name: shared-logs
      emptyDir: {}
