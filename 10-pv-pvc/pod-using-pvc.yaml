apiVersion: v1
kind: Pod
metadata:
  name: app-pod-pvc
  namespace: dev
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: app-data-pvc
