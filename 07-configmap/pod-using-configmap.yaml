apiVersion: v1
kind: Pod
metadata:
  name: app-pod
  namespace: dev
spec:
  containers:
    - name: app
      image: myapp:1.0
      envFrom:
        - configMapRef:
            name: app-config          # inject all keys as env vars
      env:
        - name: SPECIFIC_VAR
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config       # mount as files
  volumes:
    - name: config-volume
      configMap:
        name: app-config
